# Publishes a GitHub Release with a universal macOS binary for every version tag.
# vX.Y.Z -> latest release; vX.Y.Z-alpha.N / -beta.N / -rc.N -> pre-release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # tags, to find the previous release

      - name: Tag must match Cargo.toml version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$v" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $v"
            exit 1
          fi

      - name: Toolchain
        run: |
          brew install protobuf
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/dropbridge \
            target/aarch64-apple-darwin/release/dropbridge \
            target/x86_64-apple-darwin/release/dropbridge
          dist/dropbridge --version
          cp README.md LICENSE dist/
          tar -czf "dropbridge-$TAG-macos-universal.tar.gz" -C dist .
          shasum -a 256 dropbridge-*.tar.gz > checksums.txt

      - name: Release notes from the README changelog
        run: |
          # Fails the release if an entry has no "Type:" prefix.
          .github/release-notes.sh "$TAG" > notes.md
          if [ -s notes.md ]; then
            echo "NOTES=--notes-file=notes.md" >> "$GITHUB_ENV"
          else
            echo "::warning::No '### $TAG' section in the README changelog; using generated notes"
            echo "NOTES=--generate-notes" >> "$GITHUB_ENV"
          fi

      - name: Contributors since the previous tag
        if: env.NOTES == '--notes-file=notes.md' # generated notes already credit authors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # @mentions make GitHub show a Contributors avatar row on the release.
          if prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null); then
            logins=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$TAG" --jq '.commits[].author.login // empty')
          else
            logins=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits?sha=$TAG" --jq '.[].author.login // empty')
          fi
          logins=$(echo "$logins" | { grep -v '\[bot\]$' || true; } | sort -uf)
          if [ -n "$logins" ]; then
            printf '\n### Contributors\n\n%s\n' "$(echo "$logins" | sed 's/^/@/' | paste -sd ' ' -)" >> notes.md
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dropbridge-*.tar.gz checksums.txt --clobber
            if [ "$NOTES" != "--generate-notes" ]; then gh release edit "$TAG" "$NOTES"; fi
          else
            gh release create "$TAG" --verify-tag "$NOTES" $pre \
              --title "DropBridge $TAG" dropbridge-*.tar.gz checksums.txt
          fi
